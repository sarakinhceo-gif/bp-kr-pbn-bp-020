<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="884" cy="-43" r="88" fill="#047857" opacity="0.08"/>
    <circle cx="1247" cy="666" r="86" fill="#047857" opacity="0.10"/>
    <circle cx="1243" cy="274" r="44" fill="#047857" opacity="0.09"/>
    <circle cx="226" cy="493" r="82" fill="#047857" opacity="0.14"/>
    <circle cx="1066" cy="-40" r="71" fill="#047857" opacity="0.11"/>
    <circle cx="65" cy="80" r="33" fill="#047857" opacity="0.10"/>
    <rect x="793" y="520" width="21" height="98" rx="8" fill="#059669" opacity="0.12" transform="rotate(44, 1010, 358)"/>
    <rect x="1091" y="-38" width="87" height="86" rx="8" fill="#059669" opacity="0.05" transform="rotate(10, 783, 130)"/>
    <rect x="1061" y="611" width="89" height="93" rx="8" fill="#059669" opacity="0.09" transform="rotate(42, 478, 553)"/>
    <rect x="542" y="398" width="87" height="78" rx="8" fill="#059669" opacity="0.06" transform="rotate(33, 829, 611)"/>
    <rect x="-100" y="121" width="50" height="96" rx="8" fill="#059669" opacity="0.05" transform="rotate(14, 340, 142)"/>
    <rect x="478" y="202" width="74" height="61" rx="8" fill="#059669" opacity="0.07" transform="rotate(43, 291, 604)"/>
    <rect x="-63" y="4" width="62" height="85" rx="8" fill="#059669" opacity="0.05" transform="rotate(4, 1289, -63)"/>
    <rect x="76" y="354" width="68" height="60" rx="8" fill="#059669" opacity="0.03" transform="rotate(8, 1008, 309)"/>
    <polygon points="713,287 770,401 656,401" fill="#047857" opacity="0.07"/>
    <polygon points="733,441 793,561 673,561" fill="#047857" opacity="0.04"/>
    <polygon points="1187,316 1232,406 1142,406" fill="#047857" opacity="0.07"/>
    <polygon points="772,-12 843,130 701,130" fill="#047857" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,576 C360,603 840,549 1200,576 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    성남 프로그램 개발 마케팅
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    성남 — 프로그램 개발
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    성남 성남 프로그램 개발 마케팅 — 프로그램 개발
  </text>
</svg>